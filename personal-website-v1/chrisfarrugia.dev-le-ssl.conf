<IfModule mod_ssl.c>
<VirtualHost *:443>

    ServerName chrisfarrugia.dev
    ServerAlias www.chrisfarrugia.dev

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chrisfarrugia.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chrisfarrugia.dev/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/chrisfarrugia_dev_error.log
    CustomLog ${APACHE_LOG_DIR}/chrisfarrugia_dev_access.log combined

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:1208/
    ProxyPassReverse / http://127.0.0.1:1208/


    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
